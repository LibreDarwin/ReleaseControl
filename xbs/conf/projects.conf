#
# xbs project database: Xcode build aliases and release-control metadata.
#
# This is the "trains + project database" half of ReleaseControl: the B&I
# build driver (buildit) is generic, and everything project-specific lives
# here instead of in code.  Lookup is by longest-prefix match of the project
# name against the alias names below.
#
# Loaded from: -conf FILE, $XBS_CONF, <bindir>/conf/projects.conf, or
# <bindir>/../share/xbs/conf/projects.conf.  Comments start with '#'.
#
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026 LibreDarwin
#
#
# Xcode-project aliases route through xcodebuild install:
#
#   alias <name> <project-subdir> [configuration <name>] [target <name>]
#
# The subdir is relative to the project's build source root (~src), and by
# default xcodebuild builds the project's default target in the "release"
# configuration (RC_TARGET_CONFIG).

alias libkdd_host            libkdd configuration ReleaseHost  target kdd.framework
alias libkdd_tests           libkdd target tests
alias libkdd                 libkdd target Default
alias libsyscall_headers_Sim libsyscall target Libsyscall_headers_Sim
alias libsyscall_driverkit   libsyscall target Libsyscall_driverkit
alias libsyscall             libsyscall target Libsyscall
alias libkmod                libkern/kmod